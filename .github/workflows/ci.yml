name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"

      - name: Scan complete Git history for common secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml \
            --redact=100 --no-banner --log-opts="--all" .

  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify release metadata and pinned adapters
        run: |
          scripts/check-release.sh --prepare
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Authenticate Gradle artifacts against canonical repositories
        run: |
          python3 scripts/check-gradle-verification.py --online \
            android/gradle/verification-metadata.xml
          python3 scripts/check-gradle-verification.py --online \
            --allow-local-trust io.github.aimalygin:xray-rust-mobile \
            smoke/android/gradle/verification-metadata.xml

  apple:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install locked Rust toolchain
        run: |
          source release/toolchains.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component llvm-tools
          rustup toolchain install "$TVOS_RUST_TOOLCHAIN" --profile minimal \
            --component rust-src
          rustup target add --toolchain "$RUST_TOOLCHAIN" \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      - name: Build test XCFramework
        env:
          APPLE_INCLUDE_MACOS: "1"
          APPLE_INCLUDE_TVOS: "1"
        run: scripts/build-apple.sh

      - name: Build and test Swift products
        run: scripts/check-apple-link.sh

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Install locked Android SDK components
        run: |
          source release/toolchains.env
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            >> "$GITHUB_ENV"

      - name: Install locked Rust toolchain
        run: |
          source release/toolchains.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Build, test, and stage Maven module
        run: scripts/build-android.sh

      - name: Resolve SDK from the staged Maven repository
        run: scripts/check-android-consumer.sh

      - name: Package standalone AAR
        run: scripts/package-android.sh
