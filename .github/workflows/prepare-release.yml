name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Mobile SDK SemVer without the v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  apple-artifact:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          source release/version.env
          test "$REQUESTED_VERSION" = "$XRAY_MOBILE_VERSION"
          scripts/check-release.sh --prepare

      - name: Install locked Rust toolchain
        run: |
          source release/toolchains.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$TVOS_RUST_TOOLCHAIN" --profile minimal \
            --component rust-src
          rustup target add --toolchain "$RUST_TOOLCHAIN" \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      - name: Build and package the immutable SwiftPM artifact
        run: |
          APPLE_INCLUDE_MACOS=1 APPLE_INCLUDE_TVOS=1 scripts/build-apple.sh
          scripts/package-apple.sh
          source release/version.env
          archive="dist/v$XRAY_MOBILE_VERSION/XrayRust.xcframework.zip"
          scripts/set-spm-checksum.sh "$archive"
          scripts/set-apple-artifact-lock.sh \
            "$GITHUB_RUN_ID" \
            "$archive" \
            "apple-release-v$XRAY_MOBILE_VERSION"
          scripts/verify-apple-archive.sh "$archive"
          scripts/check-release.sh

      - name: Upload exact release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-release-v${{ inputs.version }}
          path: dist/v${{ inputs.version }}/XrayRust.xcframework.zip
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload generated lock metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-lock-v${{ inputs.version }}
          path: |
            Package.swift
            release/artifacts.env
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  checksum-pr:
    needs: apple-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download generated lock metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-lock-v${{ inputs.version }}
          path: .

      - name: Verify generated metadata
        run: scripts/check-release.sh

      - name: Open checksum pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="release/v$VERSION-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift release/artifacts.env
          git commit -m "chore(release): lock iOS artifact for v$VERSION"
          gh auth setup-git
          git push origin "$branch"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "chore(release): lock iOS artifact for v$VERSION" \
            --body "Locks the exact SwiftPM ZIP from workflow run $GITHUB_RUN_ID. Merge this before creating tag v$VERSION."
