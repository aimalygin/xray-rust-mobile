name: Publish Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish
        required: true
        type: string
      automatic:
        description: Publish automatically after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-stable-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      XRAY_RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      verified_tag_object: ${{ steps.release.outputs.verified_tag_object }}
      verified_commit: ${{ steps.release.outputs.verified_commit }}
    steps:
      - name: Check out exact release tag without secrets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable release before environment approval
        run: |
          [[ "$XRAY_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          scripts/release-channel.sh --require-stable "$XRAY_RELEASE_TAG"
          scripts/check-release.sh "$XRAY_RELEASE_TAG"

      - name: Record verified main-branch release commit
        id: release
        run: |
          tag_ref="refs/tags/$XRAY_RELEASE_TAG"
          [[ "$(git cat-file -t "$tag_ref")" == "tag" ]]
          verified_tag_object="$(git rev-parse "$tag_ref^{tag}")"
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          verified_commit="$(git rev-parse HEAD)"
          [[ "$verified_tag_object" =~ ^[0-9a-f]{40}$ ]]
          [[ "$verified_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "verified_tag_object=$verified_tag_object" >>"$GITHUB_OUTPUT"
          echo "verified_commit=$verified_commit" >>"$GITHUB_OUTPUT"

  publish:
    needs: validate-stable-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: maven-central
    env:
      XRAY_RELEASE_TAG: ${{ inputs.tag }}
      VERIFIED_TAG_OBJECT: ${{ needs.validate-stable-tag.outputs.verified_tag_object }}
      VERIFIED_COMMIT: ${{ needs.validate-stable-tag.outputs.verified_commit }}
      PUBLISHING_TYPE: ${{ inputs.automatic && 'AUTOMATIC' || 'USER_MANAGED' }}
    steps:
      - name: Check out verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-stable-tag.outputs.verified_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity against preflight
        run: |
          [[ "$VERIFIED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$VERIFIED_COMMIT" ]]
          [[ "$XRAY_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          scripts/release-channel.sh --require-stable "$XRAY_RELEASE_TAG"
          scripts/check-release.sh "$XRAY_RELEASE_TAG"
          source release/version.env
          [[ "$XRAY_RELEASE_TAG" == "v$XRAY_MOBILE_VERSION" ]]

      - name: Download immutable Maven release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source release/version.env
          archive_name="xray-rust-mobile-$XRAY_MOBILE_VERSION-maven.zip"
          release_json="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$XRAY_RELEASE_TAG"
          )"
          jq -e \
            '.draft == false and .prerelease == false and .immutable == true' \
            <<<"$release_json" >/dev/null

          asset_digest() {
            local name="$1"
            local matches digest
            matches="$(
              jq -r --arg name "$name" \
                '[.assets[] | select(.name == $name)] | length' \
                <<<"$release_json"
            )"
            [[ "$matches" == "1" ]]
            digest="$(
              jq -r --arg name "$name" \
                '.assets[] | select(.name == $name) | .digest' \
                <<<"$release_json"
            )"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s\n' "${digest#sha256:}"
          }

          mkdir -p incoming
          for name in "$archive_name" release-manifest.json SHA256SUMS; do
            expected_digest="$(asset_digest "$name")"
            gh release download "$XRAY_RELEASE_TAG" \
              --pattern "$name" \
              --dir incoming
            actual_digest="$(sha256sum "incoming/$name" | awk '{print $1}')"
            [[ "$actual_digest" == "$expected_digest" ]]
          done

          verify_checksum_entry() {
            local name="$1"
            local expected actual count
            count="$(awk -v name="$name" '$2 == name { count++ } END { print count + 0 }' incoming/SHA256SUMS)"
            [[ "$count" == "1" ]]
            expected="$(awk -v name="$name" '$2 == name { print $1 }' incoming/SHA256SUMS)"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            actual="$(sha256sum "incoming/$name" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]]
          }
          verify_checksum_entry "$archive_name"
          verify_checksum_entry release-manifest.json

          archive_sha="$(sha256sum "incoming/$archive_name" | awk '{print $1}')"
          jq -e \
            --arg version "$XRAY_MOBILE_VERSION" \
            --arg archive "$archive_name" \
            --arg archive_sha "$archive_sha" \
            '.mobileVersion == $version and .artifacts[$archive] == $archive_sha' \
            incoming/release-manifest.json >/dev/null

      - name: Assemble and sign Central deployment bundle
        id: bundle
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$MAVEN_SIGNING_KEY" ]]
          source release/version.env
          group="$(awk -F= '$1 == "GROUP" {print $2}' android/gradle.properties)"
          artifact="$(awk -F= '$1 == "POM_ARTIFACT_ID" {print $2}' android/gradle.properties)"
          group_path="${group//.//}"
          archive="incoming/xray-rust-mobile-$XRAY_MOBILE_VERSION-maven.zip"
          root="$RUNNER_TEMP/central-root"
          version_dir="$root/$group_path/$artifact/$XRAY_MOBILE_VERSION"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          rm -f "$root/$group_path/$artifact"/maven-metadata.xml*
          [[ -f "$version_dir/$artifact-$XRAY_MOBILE_VERSION.aar" ]]
          [[ -f "$version_dir/$artifact-$XRAY_MOBILE_VERSION.pom" ]]
          [[ -f "$version_dir/$artifact-$XRAY_MOBILE_VERSION-sources.jar" ]]

          javadoc="$version_dir/$artifact-$XRAY_MOBILE_VERSION-javadoc.jar"
          if [[ ! -f "$javadoc" ]]; then
            docs="$RUNNER_TEMP/central-javadoc"
            mkdir -p "$docs"
            {
              echo "xray-rust-mobile $XRAY_MOBILE_VERSION"
              echo
              echo "API and integration documentation:"
              echo "https://github.com/aimalygin/xray-rust-mobile/tree/$XRAY_RELEASE_TAG"
            } > "$docs/README.md"
            jar --create --file "$javadoc" -C "$docs" README.md
          fi

          find "$version_dir" -maxdepth 1 -type f \
            ! -name '*.asc' ! -name '*.md5' ! -name '*.sha1' \
            ! -name '*.sha256' ! -name '*.sha512' -print0 |
            while IFS= read -r -d '' file; do
              md5sum "$file" | awk '{print $1}' > "$file.md5"
              sha1sum "$file" | awk '{print $1}' > "$file.sha1"
              sha256sum "$file" | awk '{print $1}' > "$file.sha256"
              sha512sum "$file" | awk '{print $1}' > "$file.sha512"
            done

          printf '%s' "$MAVEN_SIGNING_KEY" | gpg --batch --import
          signing_key_id="$(
            gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "sec" {print $5; exit}'
          )"
          [[ -n "$signing_key_id" ]]
          find "$version_dir" -maxdepth 1 -type f \
            ! -name '*.asc' ! -name '*.md5' ! -name '*.sha1' \
            ! -name '*.sha256' ! -name '*.sha512' -print0 |
            while IFS= read -r -d '' file; do
              gpg --batch --yes --armor --detach-sign \
                --pinentry-mode loopback \
                --passphrase "$MAVEN_SIGNING_PASSWORD" \
                --local-user "$signing_key_id" \
                --output "$file.asc" \
                "$file"
            done

          names=(
            "$artifact-$XRAY_MOBILE_VERSION.aar"
            "$artifact-$XRAY_MOBILE_VERSION.pom"
            "$artifact-$XRAY_MOBILE_VERSION.module"
            "$artifact-$XRAY_MOBILE_VERSION-sources.jar"
            "$artifact-$XRAY_MOBILE_VERSION-javadoc.jar"
          )
          for name in "${names[@]}"; do
            file="$version_dir/$name"
            [[ -f "$file" ]]
            [[ -f "$file.asc" ]]
            [[ -f "$file.md5" ]]
            [[ -f "$file.sha1" ]]
          done

          bundle="$RUNNER_TEMP/xray-rust-mobile-$XRAY_MOBILE_VERSION-central.zip"
          (
            cd "$root"
            find . -type f -print | LC_ALL=C sort | zip -q -X "$bundle" -@
          )
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "name=xray-rust-mobile-$XRAY_MOBILE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload bundle to Central Publisher Portal
        id: upload
        env:
          BUNDLE_PATH: ${{ steps.bundle.outputs.path }}
          DEPLOYMENT_NAME: ${{ steps.bundle.outputs.name }}
          GH_TOKEN: ${{ github.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          scripts/verify-github-release-tag.sh \
            "$XRAY_RELEASE_TAG" \
            "$VERIFIED_TAG_OBJECT" \
            "$VERIFIED_COMMIT"
          [[ -n "$MAVEN_CENTRAL_USERNAME" ]]
          [[ -n "$MAVEN_CENTRAL_PASSWORD" ]]
          auth="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          deployment_id="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $auth" \
              --form "bundle=@$BUNDLE_PATH;type=application/octet-stream" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=$DEPLOYMENT_NAME&publishingType=$PUBLISHING_TYPE"
          )"
          [[ -n "$deployment_id" ]]
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for validation or publication
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment_id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          auth="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          for attempt in {1..60}; do
            response="$(
              curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $auth" \
                "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID"
            )"
            state="$(jq -r '.deploymentState' <<<"$response")"
            case "$state" in
              PUBLISHED)
                echo "Maven Central deployment published: $DEPLOYMENT_ID"
                exit 0
                ;;
              VALIDATED)
                if [[ "$PUBLISHING_TYPE" == "USER_MANAGED" ]]; then
                  echo "Deployment validated and awaits approval: $DEPLOYMENT_ID"
                  echo "### Maven Central deployment validated" >> "$GITHUB_STEP_SUMMARY"
                  echo "Deployment ID: \`$DEPLOYMENT_ID\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "Publish it from https://central.sonatype.com/publishing" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                ;;
              FAILED)
                jq . <<<"$response"
                exit 1
                ;;
              PENDING|VALIDATING|PUBLISHING) ;;
              *)
                echo "Unexpected Central state: $state" >&2
                jq . <<<"$response"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Maven Central: $DEPLOYMENT_ID" >&2
          exit 1
